name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "pyinstaller>=6.0"

      - name: Build exe
        run: |
          pyinstaller WDS_Optimizer.spec --clean --noconfirm

      - name: Zip artifact
        run: |
          Compress-Archive -Path dist\WDS_Optimizer `
                           -DestinationPath WDS_Optimizer_windows_x64.zip

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: WDS_Optimizer_windows_x64.zip
          generate_release_notes: true
          draft: false