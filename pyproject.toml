[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wds-optimizer"
version = "0.1.0"
description = "Water distribution network optimization with WNTR (Python port)"
requires-python = ">=3.10"
dependencies = [
    "wntr>=1.3,<2.0",
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib", "openpyxl"]

[tool.setuptools.packages.find]
where = ["src"]