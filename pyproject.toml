[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wds-optimizer"
version = "0.1.0"
description = "Water distribution network optimization with WNTR (Python port)"
requires-python = ">=3.10"
dependencies = [
    "wntr>=1.3,<2.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "plotly>=5.18",
    "streamlit>=1.30",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "matplotlib>=3.7"]

[project.scripts]
wds-optimizer = "wds_optimizer.app.run:main"

[tool.setuptools.packages.find]
where = ["src"]