[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wds-optimizer"
version = "0.5.0"                          # ← از 0.1.0 → 0.5.0
description = "Water distribution network optimization with WNTR (Python port)"
requires-python = ">=3.11,<3.14"           # ← 3.10 → 3.11 (numpy 2.x نیاز دارد)

dependencies = [
    "wntr>=1.5.0,<2.0",
    "numpy>=2.2.6,<3.0",
    "pandas>=2.0,<3.0",                    # ← سقف از 2.3 → 3.0
    "openpyxl>=3.1",
    "plotly>=5.18",
    "streamlit>=1.30",
    "six>=1.16",                           # ← نگه دارید (بی‌ضرر است)
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "matplotlib>=3.7,<4.0",
]

[project.scripts]
wds-optimizer = "wds_optimizer.app.run:main"

[tool.setuptools.packages.find]
where = ["src"]